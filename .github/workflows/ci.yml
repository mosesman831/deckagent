name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check bundled Worker assets
        run: npm run check:worker-assets

      - name: Build + type-check core packages
        run: npm run build

      - name: Test mcp-server
        run: npm run test --workspace=packages/mcp-server
        env:
          CI: true

      - name: Test cloudflare-worker
        run: npm run test --workspace=packages/cloudflare-worker
        env:
          CI: true

      - name: Test desktop-daemon
        run: npm run test --workspace=packages/desktop-daemon
        env:
          CI: true

      - name: Security smoke (Wave 4 policy)
        run: npm run security:smoke
        env:
          CI: true

      - name: Test cli
        run: npm run test --workspace=packages/cli
        env:
          CI: true

      - name: Pack smoke
        run: npm run pack:smoke
        env:
          CI: true

      - name: Live MCP e2e (wrangler + daemon curl)
        run: npm run e2e:mcp
        env:
          CI: true

      - name: Install + test + build v2-extension
        run: |
          npm run test --workspace=packages/v2-extension
          npm run build --workspace=packages/v2-extension
        env:
          CI: true
